name: app-build-action-dev
on:
  workflow_dispatch:

jobs:
  # 打包Android、iOS、Mac
  build-mac-ios-android:
    runs-on: macos-14

    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 编译Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          channel: 'stable'

      - name: Enable Flutter Desktop
        run: |
          flutter config --enable-macos-desktop
          
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get
          
      - name: Install appdmg
        run: npm install -g appdmg
        
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      #打包iOS
      - name: Build IPA
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer
          cd simple_live_app
          rm -rf build/ios
          rm -rf ios/Pods ios/Podfile.lock
          flutter build ipa --release --no-codesign

      #创建未签名ipa
      - name: Create IPA
        run: |
          cd simple_live_app
          # 自动寻找 Runner.app 的位置，不管它在哪个子目录
          APP_PATH=$(find build/ios/archive -name "Runner.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/ios -name "Runner.app" | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          
          mkdir -p build/ios/iphoneos/Payload
          cp -R "$APP_PATH" build/ios/iphoneos/Payload/
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload
          cd ../../../

      # 上传IPA至Artifacts
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            simple_live_app/build/ios/iphoneos/ios_no_sign.ipa
          
      # 打包Mac端
      - name: Build MacOS
        run: |
          cd simple_live_app
          flutter_distributor release --name mac --jobs dmg

      # 上传Mac端至Artifacts
      - name: Upload MacOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            simple_live_app/dist/*/simple-live-*-macos.dmg

      - run: echo "🍏 This job's status is ${{ job.status }}."
